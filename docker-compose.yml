services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vehicle_damage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vehicle_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vehicle_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_damage_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vehicle_admin} -d ${POSTGRES_DB:-vehicle_damage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vehicle_damage_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vehicle_damage_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vehicle_admin}:${POSTGRES_PASSWORD:-vehicle_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-vehicle_damage_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - app_storage:/app/storage
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: backend/worker.Dockerfile
    container_name: vehicle_damage_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vehicle_admin}:${POSTGRES_PASSWORD:-vehicle_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-vehicle_damage_db}
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - app_storage:/app/storage

  nginx:
    image: nginx:alpine
    container_name: vehicle_damage_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  app_storage:
